name: spec-test

on:
  workflow_call:
    inputs:
      cache-key:
        type: string
        required: true

jobs:
  spec-test:
    name: spec-test-${{ matrix.spec }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        spec:
          [
            deathknight_blood,
            deathknight_frost,
            deathknight_unholy,
            demonhunter_devourer,
            demonhunter_havoc,
            demonhunter_vengeance,
            druid_balance,
            druid_feral,
            druid_guardian,
            evoker_augmentation,
            evoker_devastation,
            hunter_beast_mastery,
            hunter_marksmanship,
            hunter_survival,
            mage_arcane,
            mage_fire,
            mage_frost,
            monk_brewmaster,
            monk_windwalker,
            paladin_protection,
            paladin_retribution,
            priest_shadow,
            rogue_assassination,
            rogue_outlaw,
            rogue_subtlety,
            shaman_elemental,
            shaman_enhancement,
            warlock_affliction,
            warlock_demonology,
            warlock_destruction,
            warrior_arms,
            warrior_fury,
            warrior_protection,
          ]

    env:
      UBSAN_OPTIONS: print_stacktrace=1
      SIMC: ${{ runner.workspace }}/b/ninja/simc
      BASE_ARGS: >-
        output=/dev/null
        threads=4
        profileset_work_threads=2
        iterations=10
        cleanup_threads=1
        allow_experimental_specializations=1
      PLAYER_ARGS: load_default_gear=1
      MT_ARGS: desired_targets=10
      DS_ARGS: fight_style=DungeonSlice

    steps:
      - uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.workspace }}/b/ninja/simc
            profiles
            tests
            generate_profiles_ci.sh
            .git
          key: ${{ inputs.cache-key }}

      - name: Derive class/spec strings
        env:
          MATRIX_SPEC: ${{ matrix.spec }}
        run: |
          echo "CLASS=${MATRIX_SPEC%%_*}" >> "$GITHUB_ENV"
          echo "SPEC=${MATRIX_SPEC#*_}" >> "$GITHUB_ENV"

      # All effects + sets — the most important crash check for our new trinket code
      - name: "All effects + sets: single target"
        run: |
          $SIMC $BASE_ARGS \
            enable_all_talents=1 enable_all_item_effects=1 enable_all_sets=1 \
            $CLASS=${{ matrix.spec }} spec=$SPEC $PLAYER_ARGS

      - name: "All effects + sets: multi target (10)"
        if: always()
        run: |
          $SIMC $BASE_ARGS $MT_ARGS \
            enable_all_talents=1 enable_all_item_effects=1 enable_all_sets=1 \
            $CLASS=${{ matrix.spec }} spec=$SPEC $PLAYER_ARGS

      - name: "All effects + sets: dungeon slice"
        if: always()
        run: |
          $SIMC $BASE_ARGS $DS_ARGS \
            enable_all_talents=1 enable_all_item_effects=1 enable_all_sets=1 \
            $CLASS=${{ matrix.spec }} spec=$SPEC $PLAYER_ARGS

      # Default talents with hero trees and tier set
      - name: "Default talents + hero tree 1 + 2pc/4pc"
        if: always()
        run: |
          $SIMC $BASE_ARGS \
            $CLASS=${{ matrix.spec }} spec=$SPEC $PLAYER_ARGS \
            load_default_talents=1 hero_talents=1 set_bonus=latest_2pc=1/latest_4pc=1

      - name: "Default talents + hero tree 2 + 2pc/4pc"
        if: always()
        run: |
          $SIMC $BASE_ARGS \
            $CLASS=${{ matrix.spec }} spec=$SPEC $PLAYER_ARGS \
            load_default_talents=1 hero_talents=2 set_bonus=latest_2pc=1/latest_4pc=1

      # Profileset sanity (exercises parallelism + result aggregation)
      - name: "Profileset test"
        if: always()
        run: |
          $SIMC $BASE_ARGS \
            $CLASS=${{ matrix.spec }} spec=$SPEC $PLAYER_ARGS \
            profileset.base=load_default_talents=1 \
            profileset.ht1=load_default_talents=1 profileset.ht1+=hero_talents=1 \
            profileset.ht2=load_default_talents=1 profileset.ht2+=hero_talents=2 \
            profileset.ht1_4pc=load_default_talents=1 profileset.ht1_4pc+=hero_talents=1 \
            profileset.ht1_4pc+=set_bonus=latest_2pc=1 profileset.ht1_4pc+=set_bonus+=/latest_4pc=1

      # HTML + JSON output
      - name: "HTML + JSON output"
        if: always()
        run: |
          $SIMC $BASE_ARGS html=test.html json=test.json \
            enable_all_talents=1 enable_all_item_effects=1 enable_all_sets=1 \
            $CLASS=${{ matrix.spec }} spec=$SPEC $PLAYER_ARGS

      # APL dump for tracking
      - name: "Dump APL"
        id: dump-apl
        if: github.event_name == 'push' && !failure()
        run: |
          mkdir -p apl_out
          $SIMC save_profiles=1 save_full_profile=0 \
            enable_all_talents=1 enable_all_sets=1 \
            allow_experimental_specializations=1 \
            $CLASS=${{ matrix.spec }} spec=$SPEC $PLAYER_ARGS \
            save_actions=apl_out/${{ matrix.spec }}.simc

      - name: "Upload APL artifact"
        if: steps.dump-apl.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: apl-${{ github.sha }}-${{ matrix.spec }}
          path: apl_out/${{ matrix.spec }}.simc
          retention-days: 3
