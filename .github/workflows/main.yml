name: CI

on:
  push:
    branches: [midnight]
    paths-ignore:
      - "ActionPriorityLists/**"
      - "SpellDataDump/**"
      - "dbc_extract3/**"
      - "casc_extract/**"
      - "doc/**"
      - "**.md"
  pull_request:
    branches: [midnight]
  workflow_dispatch:

jobs:
  # ── Build gate ──────────────────────────────────────────────────────────
  build:
    name: Build (gcc-14 + clang-18 ASan)
    runs-on: ubuntu-24.04
    env:
      CCACHE_GENERATION: 0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: gcc14-release-ccache-0-${{ github.sha }}
          restore-keys: gcc14-release-ccache-0-

      - name: Install deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcurl4-openssl-dev ninja-build ccache gcc-14 g++-14

      - name: Configure (gcc-14 RelWithDebInfo)
        run: |
          cmake -S. -Bbuild -GNinja \
            -DBUILD_GUI=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_STANDARD=17

      - name: Build
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_MAXSIZE: 192M
        run: |
          ccache -z
          ninja -C build
          ccache -s

      - name: Smoke test
        run: |
          build/simc \
            output=/dev/null html=/dev/null json=/dev/null \
            iterations=5 cleanup_threads=1 \
            warrior=test spec=fury load_default_gear=1 load_default_talents=1 \
            enable_all_item_effects=1 enable_all_sets=1

  # ── Profile tests — all 56 MID1 profiles must sim without error ────────
  profile-test:
    name: profile/${{ matrix.profile }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        profile:
          [
            MID1_Death_Knight_Blood, MID1_Death_Knight_Blood_Deathbringer,
            MID1_Death_Knight_Frost, MID1_Death_Knight_Frost_Rider,
            MID1_Death_Knight_Unholy, "MID1_Death_Knight_Unholy_San'layn",
            MID1_Demon_Hunter_Devourer, MID1_Demon_Hunter_Devourer_Void-Scarred,
            MID1_Demon_Hunter_Havoc,
            MID1_Demon_Hunter_Vengeance, MID1_Demon_Hunter_Vengeance_Aldrachi_Reaver,
            MID1_Druid_Balance, MID1_Druid_Balance_Elune, MID1_Druid_Balance_Keeper,
            MID1_Druid_Feral,
            MID1_Druid_Guardian,
            MID1_Evoker_Augmentation, MID1_Evoker_Augmentation_Chronowarden,
            MID1_Evoker_Devastation, MID1_Evoker_Devastation_FS,
            MID1_Hunter_Beast_Mastery,
            MID1_Hunter_Marksmanship,
            MID1_Hunter_Survival, MID1_Hunter_Survival_PL_DW,
            MID1_Mage_Arcane, MID1_Mage_Arcane_Sunfury,
            MID1_Mage_Fire, MID1_Mage_Fire_Frostfire,
            MID1_Mage_Frost, MID1_Mage_Frost_Frostfire,
            MID1_Monk_Brewmaster,
            MID1_Monk_Windwalker, MID1_Monk_Windwalker_Conduit,
            MID1_Paladin_Protection, MID1_Paladin_Protection_Lightsmith,
            MID1_Paladin_Retribution, MID1_Paladin_Retribution_Herald,
            MID1_Priest_Shadow, MID1_Priest_Shadow_Archon,
            MID1_Rogue_Assassination, MID1_Rogue_Assassination_Deathstalker,
            MID1_Rogue_Outlaw, MID1_Rogue_Outlaw_Trickster,
            MID1_Rogue_Subtlety,
            MID1_Shaman_Elemental,
            MID1_Shaman_Enhancement, MID1_Shaman_Enhancement_Stormbringer,
            MID1_Warlock_Affliction, MID1_Warlock_Affliction_Hellcaller,
            MID1_Warlock_Demonology, MID1_Warlock_Demonology_Soul_Harvester,
            MID1_Warlock_Destruction, MID1_Warlock_Destruction_Diabolist,
            MID1_Warrior_Arms,
            MID1_Warrior_Fury,
            MID1_Warrior_Protection,
          ]

    env:
      CCACHE_GENERATION: 0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: gcc14-release-ccache-0-${{ github.sha }}
          restore-keys: gcc14-release-ccache-0-

      - name: Install deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcurl4-openssl-dev ninja-build ccache gcc-14 g++-14

      - name: Configure + Build
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_MAXSIZE: 192M
        run: |
          cmake -S. -Bbuild -GNinja \
            -DBUILD_GUI=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_STANDARD=17
          ninja -C build

      # Core test: profile must parse and simulate without errors
      - name: "Sim: Patchwerk (1 iter)"
        run: |
          build/simc "profiles/MID1/${{ matrix.profile }}.simc" \
            output=/dev/null iterations=1 threads=4

      # Multi-target test
      - name: "Sim: Patchwerk multi-target (1 iter)"
        if: always()
        run: |
          build/simc "profiles/MID1/${{ matrix.profile }}.simc" \
            output=/dev/null iterations=1 threads=4 desired_targets=5

      # JSON + HTML output test
      - name: "Sim: JSON + HTML output"
        if: always()
        run: |
          build/simc "profiles/MID1/${{ matrix.profile }}.simc" \
            output=/dev/null json=/dev/null html=/dev/null \
            iterations=5 threads=4
