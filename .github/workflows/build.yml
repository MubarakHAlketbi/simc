name: Build

on:
  push:
    branches: [midnight]
    paths-ignore:
      - "ActionPriorityLists/**"
      - "SpellDataDump/**"
      - "dbc_extract3/**"
      - "casc_extract/**"
      - "doc/**"
      - "**.md"
  pull_request:
    branches: [midnight]
  workflow_dispatch:

env:
  CCACHE_GENERATION: 0

jobs:
  # ── gcc-14 Release build ────────────────────────────────────────────────
  gcc-build:
    name: gcc-14 RelWithDebInfo
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: gcc14-release-ccache-${{ env.CCACHE_GENERATION }}-${{ github.sha }}
          restore-keys: gcc14-release-ccache-${{ env.CCACHE_GENERATION }}-

      - name: Install deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcurl4-openssl-dev ninja-build ccache gcc-14 g++-14

      - name: Configure
        run: |
          cmake -S. -Bbuild_gcc -GNinja \
            -DBUILD_GUI=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_STANDARD=17

      - name: Build
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_MAXSIZE: 192M
        run: |
          ccache -z
          ninja -C build_gcc
          ccache -s

      - name: Smoke test
        run: |
          build_gcc/simc \
            output=/dev/null html=/dev/null json=/dev/null \
            iterations=5 cleanup_threads=1 \
            warrior=test spec=fury load_default_gear=1 load_default_talents=1

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: simc-gcc14-${{ github.sha }}
          path: build_gcc/simc
          retention-days: 1

  # ── clang-18 Debug + ASan + UBSan ──────────────────────────────────────
  clang-asan:
    name: clang-18 ASan+UBSan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: clang18-asan-ccache-${{ env.CCACHE_GENERATION }}-${{ github.sha }}
          restore-keys: clang18-asan-ccache-${{ env.CCACHE_GENERATION }}-

      - name: Install deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcurl4-openssl-dev ninja-build ccache clang-18 lld-18

      - name: Configure
        run: |
          cmake -S. -Bbuild_asan -GNinja \
            -DBUILD_GUI=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS="-Og -fno-omit-frame-pointer -fsanitize=address,undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -fsanitize=address,undefined" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_STANDARD=17

      - name: Build
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_MAXSIZE: 256M
        run: |
          ccache -z
          ninja -C build_asan
          ccache -s

      - name: Smoke test with ASan (enable all item effects)
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=0
        run: |
          build_asan/simc \
            output=/dev/null html=/dev/null json=/dev/null \
            iterations=5 cleanup_threads=1 \
            warrior=test spec=fury load_default_gear=1 load_default_talents=1 \
            enable_all_item_effects=1 enable_all_sets=1
