name: build

on:
  workflow_call:

env:
  CCACHE_GENERATION: 0

jobs:
  # Primary: gcc-14 RelWithDebInfo C++17 — binary reused by spec-test and ubuntu-test
  ubuntu-gcc-release:
    name: ubuntu-gcc-14-cpp17-release
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/.ccache
          key: ubuntu-gcc-14-release-ccache-${{ env.CCACHE_GENERATION }}-${{ github.sha }}
          restore-keys: ubuntu-gcc-14-release-ccache-${{ env.CCACHE_GENERATION }}-

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev ninja-build ccache gcc-14 g++-14

      - name: Configure
        run: |
          cmake -H. -B'${{ runner.workspace }}/b/ninja' -GNinja \
            -DBUILD_GUI=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_STANDARD=17

      - name: Build
        env:
          CCACHE_BASEDIR: ${{ runner.workspace }}
          CCACHE_DIR: ${{ runner.workspace }}/.ccache
          CCACHE_MAXSIZE: 192M
        run: |
          ccache -z
          ninja -C '${{ runner.workspace }}/b/ninja'
          ccache -s

      - name: Save binary for downstream jobs
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.workspace }}/b/ninja/simc
            profiles
            tests
            generate_profiles_ci.sh
            .git
          key: ubuntu-gcc-14-release-${{ github.sha }}

  # Secondary: clang-18 Debug + ASan + UBSan — catches memory bugs in new code
  ubuntu-clang-asan:
    name: ubuntu-clang-18-cpp17-asan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/.ccache
          key: ubuntu-clang-18-asan-ccache-${{ env.CCACHE_GENERATION }}-${{ github.sha }}
          restore-keys: ubuntu-clang-18-asan-ccache-${{ env.CCACHE_GENERATION }}-

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev ninja-build ccache clang-18 lld-18

      - name: Configure
        run: |
          cmake -H. -B'${{ runner.workspace }}/b/ninja' -GNinja \
            -DBUILD_GUI=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS="-Og -fno-omit-frame-pointer -fsanitize=address,undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -fsanitize=address,undefined" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_STANDARD=17

      - name: Build
        env:
          CCACHE_BASEDIR: ${{ runner.workspace }}
          CCACHE_DIR: ${{ runner.workspace }}/.ccache
          CCACHE_MAXSIZE: 256M
        run: |
          ccache -z
          ninja -C '${{ runner.workspace }}/b/ninja'
          ccache -s

      - name: Smoke test with ASan
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=0
        run: |
          ${{ runner.workspace }}/b/ninja/simc \
            output=/dev/null html=/dev/null json=/dev/null \
            iterations=5 cleanup_threads=1 \
            warrior=test spec=fury load_default_gear=1 load_default_talents=1 \
            enable_all_item_effects=1 enable_all_sets=1
