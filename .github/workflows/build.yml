name: Build

on:
  push:
    branches: [midnight]
    paths-ignore:
      - "ActionPriorityLists/**"
      - "SpellDataDump/**"
      - "dbc_extract3/**"
      - "casc_extract/**"
      - "doc/**"
      - "**.md"
  pull_request:
    branches: [midnight]
  workflow_dispatch:

env:
  CCACHE_GENERATION: 0
  VCVARS_PATH: "C:\\Program Files (x86)\\Microsoft Visual Studio\\18\\BuildTools\\VC\\Auxiliary\\Build\\vcvarsall.bat"

jobs:
  # ── gcc-14 Release build ────────────────────────────────────────────────
  gcc-build:
    name: gcc-14 RelWithDebInfo
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: gcc14-release-ccache-${{ env.CCACHE_GENERATION }}-${{ github.sha }}
          restore-keys: gcc14-release-ccache-${{ env.CCACHE_GENERATION }}-

      - name: Install deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcurl4-openssl-dev ninja-build ccache gcc-14 g++-14

      - name: Configure
        run: |
          cmake -S. -Bbuild_gcc -GNinja \
            -DBUILD_GUI=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_STANDARD=17

      - name: Build
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_MAXSIZE: 192M
        run: |
          ccache -z
          ninja -C build_gcc
          ccache -s

      - name: Smoke test
        run: |
          build_gcc/simc \
            output=/dev/null html=/dev/null json=/dev/null \
            iterations=5 cleanup_threads=1 \
            warrior=test spec=fury load_default_gear=1 load_default_talents=1

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: simc-gcc14-${{ github.sha }}
          path: build_gcc/simc
          retention-days: 1

  # ── clang-18 Debug + ASan + UBSan ──────────────────────────────────────
  clang-asan:
    name: clang-18 ASan+UBSan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: clang18-asan-ccache-${{ env.CCACHE_GENERATION }}-${{ github.sha }}
          restore-keys: clang18-asan-ccache-${{ env.CCACHE_GENERATION }}-

      - name: Install deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libcurl4-openssl-dev ninja-build ccache clang-18 lld-18

      - name: Configure
        run: |
          cmake -S. -Bbuild_asan -GNinja \
            -DBUILD_GUI=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS="-Og -fno-omit-frame-pointer -fsanitize=address,undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -fsanitize=address,undefined" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_STANDARD=17

      - name: Build
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_MAXSIZE: 256M
        run: |
          ccache -z
          ninja -C build_asan
          ccache -s

      - name: Smoke test with ASan (enable all item effects)
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=0
        run: |
          build_asan/simc \
            output=/dev/null html=/dev/null json=/dev/null \
            iterations=5 cleanup_threads=1 \
            warrior=test spec=fury load_default_gear=1 load_default_talents=1 \
            enable_all_item_effects=1 enable_all_sets=1

# ── Windows MSVC x64 — CLI (no Qt) ─────────────────────────────────────
  windows-cli:
    name: Windows MSVC x64 CLI
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure and Build CLI
        shell: cmd
        run: |
          call "%VCVARS_PATH%" x64
          cmake -S . -B build_cli -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DBUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17
          cmake --build build_cli --parallel

      - name: Smoke test CLI
        shell: pwsh
        run: |
          # Use .\ in PowerShell, and note Ninja outputs directly to build_cli (no Release folder)
          .\build_cli\simc.exe `
            output=nul html=nul json=nul `
            iterations=5 cleanup_threads=1 `
            warrior=test spec=fury load_default_gear=1 load_default_talents=1

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: simc-windows-cli-${{ github.sha }}
          path: build_cli\simc.exe
          retention-days: 7

# ── Windows MSVC x64 — GUI (Qt6 + WebEngine) ────────────────────────────
  windows-gui:
    name: Windows MSVC x64 GUI
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure and Build GUI
        shell: cmd
        run: |
          :: 1. Delete the poisoned cache from previous failed runs!
          if exist build_gui rmdir /s /q build_gui
          
          call "%VCVARS_PATH%" x64
          
          :: 2. Configure with a completely fresh build directory
          cmake -S . -B build_gui -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_PREFIX_PATH="C:/Qt/6.10.2/msvc2022_64" -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17
          
          :: 3. Build
          cmake --build build_gui --parallel

      - name: Smoke test GUI
        shell: pwsh
        run: |
          .\build_gui\simc.exe `
            output=nul html=nul json=nul `
            iterations=5 cleanup_threads=1 `
            warrior=test spec=fury load_default_gear=1 load_default_talents=1

      - name: Deploy Qt runtime (windeployqt)
        shell: pwsh
        run: |
          # Add your exact Qt bin folder to the PATH so windeployqt works natively
          $env:PATH = "C:\Qt\6.10.2\msvc2022_64\bin;$env:PATH"
          
          New-Item -ItemType Directory -Force -Path dist_gui
          
          Copy-Item build_gui\SimulationCraft.exe dist_gui\
          Copy-Item build_gui\simc.exe dist_gui\
          Copy-Item qt\Welcome.html dist_gui\ -ErrorAction SilentlyContinue
          Copy-Item qt\Welcome.png dist_gui\ -ErrorAction SilentlyContinue
          Copy-Item qt\Error.html dist_gui\ -ErrorAction SilentlyContinue
          Copy-Item qt\locale dist_gui\ -Recurse -ErrorAction SilentlyContinue
          
          windeployqt --release --no-translations dist_gui\SimulationCraft.exe

      - name: Package GUI as zip
        shell: pwsh
        run: Compress-Archive -Path dist_gui\* -DestinationPath simc-windows-gui.zip

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: simc-windows-gui-${{ github.sha }}
          path: simc-windows-gui.zip
          retention-days: 7
          
  # ── GitHub Release (on version tags v*) ─────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [gcc-build, clang-asan, windows-cli, windows-gui]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux CLI binary
        uses: actions/download-artifact@v4
        with:
          name: simc-gcc14-${{ github.sha }}
          path: release-artifacts/linux

      - name: Download Windows CLI binary
        uses: actions/download-artifact@v4
        with:
          name: simc-windows-cli-${{ github.sha }}
          path: release-artifacts/windows-cli

      - name: Download Windows GUI zip
        uses: actions/download-artifact@v4
        with:
          name: simc-windows-gui-${{ github.sha }}
          path: release-artifacts/windows-gui

      - name: Rename artifacts for release
        run: |
          TAG="${{ github.ref_name }}"
          mv release-artifacts/linux/simc         release-artifacts/simc-${TAG}-linux-x64
          mv release-artifacts/windows-cli/simc.exe release-artifacts/simc-${TAG}-windows-x64-cli.exe
          mv release-artifacts/windows-gui/simc-windows-gui.zip release-artifacts/simc-${TAG}-windows-x64-gui.zip
          chmod +x release-artifacts/simc-${TAG}-linux-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SimulationCraft Midnight ${{ github.ref_name }}
          body: |
            ## SimulationCraft — Midnight Expansion ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Description |
            |----------|------|-------------|
            | Linux x64 | `simc-${{ github.ref_name }}-linux-x64` | CLI binary (gcc-14, RelWithDebInfo) |
            | Windows x64 | `simc-${{ github.ref_name }}-windows-x64-cli.exe` | CLI binary (MSVC Release) |
            | Windows x64 | `simc-${{ github.ref_name }}-windows-x64-gui.zip` | GUI + CLI bundle (Qt6 + windeployqt) |

            ### What's included in the GUI zip
            - `SimulationCraft.exe` — Qt6 GUI application
            - `simc.exe` — CLI binary
            - Qt runtime DLLs (deployed by windeployqt)
            - `locale/` — translation files
            - `Welcome.html`, `Welcome.png`, `Error.html`

            ### Usage
            **CLI:** `simc.exe profile.simc iterations=10000`
            **GUI:** Extract the zip and run `SimulationCraft.exe`

            Built from commit ${{ github.sha }} on ${{ github.ref_name }}.
          files: |
            release-artifacts/simc-${{ github.ref_name }}-linux-x64
            release-artifacts/simc-${{ github.ref_name }}-windows-x64-cli.exe
            release-artifacts/simc-${{ github.ref_name }}-windows-x64-gui.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
